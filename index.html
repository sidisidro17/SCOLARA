<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOLARA - homepage</title>
<style>
  /* This is for assigning a HEX code to the code */
  :root{
    --teal:#0d7ea3;
    --teal-dark:#0a6483;
    --gold:#f7c331;
    --ink:#0b2530;
    --panel:#e4e9ed;
    --card:#c7cede;
    --card-text:#39435a;
    --cream:#f8fafc;
  }
  /* Removes the browser's default spacing and makes element sizing easier to control */
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}

  /* The entire webpage's default apperance */
  body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* Controls the overall sturcture of the page */
  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* The entire top navigation bar */
  header{
    background:var(--teal);
    color:#fff;
    padding:18px 40px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
  }
  /* The SCOLARA name and tagline */
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  .brand .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
  }
  .brand .tag{
    font-size:9px;
    letter-spacing:1px;
    opacity:0.85;
    margin-top:2px;
  }
  /* The "Home" and "Competitions" links, determining how they are arranged and how much space are between them */
  nav{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:40px;
    justify-self:center;
  }
  nav a{
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
  }
  /* Controls the "Log In" link and the icon, determining how they are arranged and how much space is between them */
  .login{
    display:flex;
    align-items:center;
    gap:8px;
    justify-self:end;
  }
  .login svg{width:22px;height:22px;}

  /* The big introductory area underneath the navigation bar. It controls the background, text, alignment, spacing*/
  .hero{
    background:var(--teal);
    color:#fff;
    text-align:center;
    padding:64px 40px 96px;
  }
  .hero h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:0.5px;
  }
  .hero h1 .challenge{
    color:var(--gold);
  }
  .hero p{
    max-width:560px;
    margin:18px auto 0;
    font-size:15px;
    color:#e9f3f7;
    line-height:1.5;
  }
  .hero .actions{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:32px;
    flex-wrap:wrap;
  }
  .hero .actions a{
    background:#cfd7de;
    color:var(--ink);
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    padding:14px 26px;
    border-radius:24px;
  }

  /* The area behind the three info cards. Keeps the teal background and provide space below the panel */
  .panel-wrap{
    position:relative;
    background:var(--teal);
    padding-bottom:70px;
  }
  .panel{
    background:var(--panel);
    max-width:920px;
    margin:0 auto;
    transform:translateY(-46px);
    border-radius:14px;
    padding:56px 40px;
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    box-shadow:0 12px 24px rgba(0,0,0,0.08);
  }
  .card{
    background:var(--card);
    color:var(--card-text);
    width:150px;
    height:150px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    font-weight:600;
    padding:12px;
  }

  /* Footer grows to fill the rest of the viewport */
  footer{
    background:var(--teal);
    flex:1;
    min-height:110px;
  }
  /* header padding and grid gap adjustments for smaller screens */
  @media (max-width:600px){
    header{padding:16px 20px;}
    nav{gap:20px;}
    .hero{padding:48px 20px 80px;}
    .hero h1{font-size:26px;}
    .panel{padding:40px 20px; gap:16px;}
    .card{width:120px;height:120px;font-size:11px;}
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="brand">
      <span class="name">SCOLARA</span>
      <span class="tag">Discover · Prepare · Compete</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Competitions</a>
    </nav>
    <div class="login">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <a href="login.html" style="color:#fff;text-decoration:none;font-weight:600;font-size:15px;">Log In</a>
    </div>
  </header>

  <div class="hero">
    <h1>RISE TO THE <span class="challenge">CHALLENGE</span></h1>
    <p style="color:#000; font-weight:700;">Discover academic competitions, prepare with fellow students, and compete beyond the classroom.</p>
    <div class="actions">
      <a href="#">Explore Competitions</a>
      <a href="#">Join the Community</a>
    </div>
  </div>

  <div class="panel-wrap">
    <div class="panel">
      <div class="card">Documentation</div>
      <div class="card">Details and Organizations</div>
      <div class="card">Sponsors</div>
    </div>
  </div>
<footer></footer>
</div>

</body>
</html>
