<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOLARA - login</title>

<!-- Google Fonts for Inter & Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* sizing for easier control */
  * {
    box-sizing: border-box;
  }
  /* Resetting default browser styles for html and body */
  html, body {
    margin: 0;
    padding: 0;
  }
  /* controls the overall page */
  body {
    font-family: 'Inter', sans-serif;
    background-color: #007ba2;
    overflow-x: hidden;
    min-height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  /* controls what happens when the user selects text on the page */
  ::selection {
    background-color: #fcd34d;
    color: #0f172a;
  }

  .heading-font {
    font-family: 'Montserrat', sans-serif;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  /* everything that goes in the header/navigation bar */
  header {
    width: 100%;
    padding-top: 1.5rem;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
    z-index: 10;
  }

  nav {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #ffffff;
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    padding-bottom: 1rem;
  }

  .nav-link {
    font-weight: 700;
    font-size: 0.875rem;
    letter-spacing: 0.025em;
    transition: opacity 0.2s ease;
  }

  .nav-link:hover {
    opacity: 0.8;
  }
  /* The logo and tagline are centered in the navigation bar */
  .logo-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1.25;
    transition: opacity 0.2s ease;
  }

  .brand-title:hover {
    opacity: 0.9;
  }

  .tagline {
    font-size: 9px;
    font-weight: 600;
    color: #cffafe;
    letter-spacing: 0.15em;
    margin-top: 0.125rem;
    text-transform: uppercase;
  }

  .nav-divider {
    width: 100%;
    max-width: 72rem;
    margin: 0 auto;
    height: 1.5px;
    background-color: rgba(15, 23, 42, 0.4);
  }

  /* controls the section containing the login card */
  main {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    margin-top: auto;
    margin-bottom: auto;
    z-index: 20;
  }

  .modal-card {
    background-color: #e2e7eb;
    border-radius: 1.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 36rem;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  .title-section {
    margin-bottom: 2rem;
  }

  .title-section h1,
  .title-section h2 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 2.5rem;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1;
    margin: 0;
  }

  .title-section h1 {
    color: #000000;
  }

  .title-section h2 {
    color: #f5b81a;
    margin-top: 0.25rem;
  }
/* controls the Username and Password input fields */
  .input-field {
    width: 100%;
    background-color: #627f91;
    color: #ffffff;
    padding: 0.875rem 1.25rem;
    border-radius: 0.75rem;
    border: none;
    font-size: 0.875rem;
    font-weight: 400;
    box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1);
    transition: box-shadow 0.15s ease;
  }

  .input-field::placeholder {
    color: #d8e2e8;
    font-weight: 400;
  }

  .input-field:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.8);
  }

  .button-wrap {
    padding-top: 0.75rem;
    display: flex;
    justify-content: center;
  }

  .login-btn {
    background-color: #f5b81a;
    color: #020617;
    font-weight: 700;
    padding: 0.625rem 3rem;
    border-radius: 0.5rem;
    border: none;
    font-size: 0.875rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: box-shadow 0.2s ease, transform 0.1s ease, background-color 0.2s ease;
  }

  .login-btn:hover {
    background-color: #e5a910;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  .login-btn:active {
    transform: scale(0.95);
  }

  footer {
    height: 2rem;
    width: 100%;
  }

  /* header padding and grid gap adjustments for smaller screens */
  @media (min-width: 640px) {
    header {
      padding-top: 2rem;
      padding-left: 3rem;
      padding-right: 3rem;
    }

    .nav-link {
      font-size: 1rem;
    }

    .brand-title {
      font-size: 1.875rem;
    }

    .tagline {
      font-size: 11px;
    }

    main {
      padding: 1.5rem;
    }

    .modal-card {
      max-width: 42rem;
      padding: 3.5rem 4rem;
    }

    .title-section {
      margin-bottom: 2.5rem;
    }

    .title-section h1,
    .title-section h2 {
      font-size: 3rem;
    }

    form {
      max-width: 28rem;
      gap: 1.25rem;
    }

    .input-field {
      font-size: 1rem;
    }

    .login-btn {
      font-size: 1rem;
    }

    footer {
      height: 3rem;
    }
  }

  @media (min-width: 768px) {
    header {
      padding-left: 5rem;
      padding-right: 5rem;
    }

    .nav-link {
      font-size: 1.125rem;
    }

    .brand-title {
      font-size: 2.25rem;
    }

    .title-section h1,
    .title-section h2 {
      font-size: 3.75rem;
    }
  }
</style>
</head>
<body>

<!-- Top Header Navbar -->
<header>
<nav>

  <!-- Home Link -->
  <a href="index.html" class="nav-link">Home</a>

  <!-- Logo Centered Exactly -->
  <div class="logo-wrap">
    <!-- SCOLARA MAIN BRAND TITLE -->
    <a href="index.html" class="brand-title">SCOLARA</a>
    <!-- TAGLINE -->
    <span class="tagline">Discover &middot; Prepare &middot; Compete</span>
  </div>

  <!-- Competitions Link -->
  <a href="dashboard.html" class="nav-link">Competitions</a>

</nav>

<br>

<div class="nav-divider"></div>
</header>

<!-- Main Center Area with Modal Card -->
<main>
<div class="modal-card">

  <!-- Title Section -->
  <div class="title-section">
    <h1>START</h1>
    <h2>HERE</h2>
  </div>

  <!-- Form -->

    <!-- Username Input -->
    <div>
      <input type="text" placeholder="Username:" class="input-field" required />
    </div>

    <br> 
    
    <!-- Password Input -->
    <div>
      <input type="password" placeholder="Password:" class="input-field" required />
    </div>

    <!-- Login Button -->
    <div class="button-wrap">
      <button type="submit" class="login-btn"><a href="dashboard.html">Login</a></button>
    </div>

</div>
</main>

</body>
</html>
